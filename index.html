<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b9d">
<title>百均ネイル研究所 ― 映えネイルの教科書</title>
<style>
:root{--bg:#fffaf8;--ink:#3d2b33;--soft:#7a5f6b;--line:#f3dde2;--pink:#ff6b9d;--deep:#e84e83;--pinksoft:#ffe3ec;--mint:#3ec6a7;--shadow:0 6px 20px rgba(232,78,131,.14)}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.xl{font-size:21px}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;line-height:1.65}
button{font:inherit;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom))}
.ver{background:#3d2b33;color:#fff;font-weight:800;font-size:.8rem;text-align:center;padding:3px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:3px 16px;font-weight:800;font-size:.95rem}
.sm{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;color:var(--soft)}
h1{font-size:1.65rem;line-height:1.35;margin:10px 0 4px;text-align:center}
.lead{text-align:center;color:var(--soft);margin:0 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:800;color:var(--soft)}
.chips button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;display:block;width:100%}
.card .ph{aspect-ratio:3/2;background:#f6ece8;position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .sw{display:flex;height:100%;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:10px}
.card .sw i{width:20px;height:30px;border-radius:10px 10px 7px 7px;border:1px solid rgba(0,0,0,.12);display:block}
.card .soon{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:1px 10px;font-size:.7rem;font-weight:800}
.card .nm{padding:8px 10px 10px;font-weight:800;font-size:.95rem;line-height:1.35}
.card .nm small{display:block;color:var(--soft);font-weight:700;font-size:.78rem;margin-top:2px}
.back{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:800;color:var(--soft);margin:4px 0 8px}
.photo{position:relative;border-radius:18px;overflow:hidden;background:#f6ece8;aspect-ratio:3/2;box-shadow:var(--shadow)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .none{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--soft);font-weight:800;gap:10px}
.photo .none .dots{display:flex;gap:8px}.photo .none i{width:28px;height:42px;border-radius:14px 14px 10px 10px;border:1px solid rgba(0,0,0,.12);display:block}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:800;color:var(--soft);font-size:1rem}
.tabs button[aria-pressed=true]{border-color:var(--pink);background:var(--pinksoft);color:var(--deep)}
h2{font-size:1.4rem;margin:14px 0 2px;line-height:1.35}
.meta{color:var(--soft);font-weight:700;font-size:.92rem}
.box{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.box h3{margin:0 0 6px;font-size:1.1rem;color:var(--deep)}
.box ul{list-style:none;margin:0;padding:0}
.box li{padding:7px 0;border-bottom:1px solid var(--line)}
.box li:last-child{border-bottom:0}
.box label{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.box input{width:24px;height:24px;margin-top:3px;accent-color:var(--pink);flex:none}
.box .k{display:inline-block;background:var(--pinksoft);color:var(--deep);border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:800;margin-right:6px}
.nav{display:flex;gap:10px;margin:10px 0}
.nav button{flex:1;border:0;border-radius:16px;background:var(--deep);color:#fff;font-weight:900;font-size:1.25rem;padding:16px 8px;min-height:3.6rem;box-shadow:var(--shadow)}
.nav button:active{transform:scale(.97)}
.nav .cnt{flex:none;align-self:center;font-weight:800;color:var(--soft);min-width:4.2em;text-align:center}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.strip button{flex:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;color:var(--ink);white-space:nowrap}
.strip button[aria-pressed=true]{border-color:var(--pink);background:var(--pinksoft)}
.strip i{width:12px;height:18px;border-radius:6px 6px 4px 4px;border:1px solid rgba(0,0,0,.15);display:block}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="ver" id="ver">版 v3.1　11/22</div>
<div class="wrap">

<section id="viewer">
  <div class="top"><span class="tag">百均ネイル研究所</span><button class="sm" id="xl">文字を大きく</button></div>
  <div class="photo" id="photo" style="margin-top:10px"></div>
  <div class="tabs" id="tabs"></div>
  <div class="nav"><button id="prev" aria-label="前のデザイン">◀ 前へ</button><span class="cnt" id="cnt"></span><button id="next" aria-label="次のデザイン">次へ ▶</button></div>
  <h2 id="dname"></h2>
  <div class="meta" id="dmeta"></div>
  <div class="strip" id="strip" aria-label="デザインを選ぶ"></div>
  <p id="ddesc"></p>
  <div class="box"><h3>🛒 使うもの（百均で買うもの）</h3><ul id="items"></ul></div>
  <div class="box"><h3>💅 やり方</h3><p id="dart" style="margin:0"></p></div>
</section>
</div>
<script>
var DESIGNS=[{"id":"syruppink","name":"シロップピンク ジェリー","world":"韓シロップ","colorFam":"スキンカラー","texture":"ジェリー","pattern":"柄なし","season":"通年","difficulty":"入門","colors":["#f6c9cd","#f4bcc4","#f6c9cd","#f2b3bc","#f6c9cd"],"desc":"韓国ネイルの王道、透け感ピンクのシロップカラー。素の爪がほんのり透けるので、失敗しても目立ちにくい入門デザイン。まずは写真で「着けた感じ」を見てみて。","art":"透けピンクを薄く2〜3度塗りして、色の濃さを少しずつ重ねます。1回ごとにしっかり乾かすとムラなくちゅるんと仕上がります。","items":{"base":["ピールオフベース（剥がせるタイプ）","ベースコート"],"color":["カラージェル／ポリッシュ（透けピンク系）"],"parts":[],"tools":["綿棒"],"care":["ネイルオイル"]}},{"id":"milkwhite","name":"ミルクホワイト ワンカラー","world":"韓シロップ","colorFam":"スキンカラー","texture":"ジェリー","pattern":"柄なし","season":"通年","difficulty":"入門","colors":["#f7f2ec","#f4efe8","#f7f2ec","#f4efe8","#f7f2ec"],"desc":"真っ白すぎない、ミルクを混ぜたような柔らかい白のワンカラー。清潔感があって、どんな服にも合う万能デザイン。写真だと白の柔らかさがよく分かります。","art":"白系はムラになりやすいので、薄く3回に分けて塗るのがコツ。刷毛の跡が残ったら、乾く前に刷毛を寝かせて表面をそっとなでます。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（ミルクホワイト系）"],"parts":[],"tools":["綿棒"],"care":["ネイルオイル","除光液（修正用）"]}},{"id":"skinbeige","name":"スキンベージュ ワンカラー","world":"欧ミニマル","colorFam":"スキンカラー","texture":"ジェリー","pattern":"柄なし","season":"通年","difficulty":"入門","colors":["#d9bda6","#d3b198","#d9bda6","#cdaa8d","#d9bda6"],"desc":"肌になじむベージュのワンカラー。指が長くすっきり見えて、お仕事や学校でも浮かない大人の定番。自分の肌色に近い色を選ぶのがポイントです。","art":"ベージュは薄く2度塗り。肌より少しだけ明るい色を選ぶと、手元がぱっと華やぎます。根元を1mm空けて塗ると伸びても目立ちません。","items":{"base":["ピールオフベース（剥がせるタイプ）","ベースコート"],"color":["カラージェル／ポリッシュ（ベージュ系）"],"parts":[],"tools":["綿棒"],"care":["ネイルオイル"]}},{"id":"gingham","name":"ピンクギンガム チェック","world":"韓シロップ","colorFam":"スキンカラー","texture":"ジェリー","pattern":"チェック","season":"春","difficulty":"中級","colors":["#fdeef3","#fdeef3","#fdeef3","#fdeef3","#fdeef3"],"desc":"ピンク×白のギンガムチェックを全指に。布みたいな格子柄が春らしくて、写真映えも抜群。線を引く練習になる中級デザインです。","art":"白ベースを塗って完全に乾かしてから、細筆でピンクの縦線2本・横線2本を等間隔に引きます。線が交わる所が自然に濃くなるのがギンガムらしさ。先に薬指だけで練習すると安心。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（ホワイト系）","カラージェル／ポリッシュ（ピンク系）"],"parts":[],"tools":["細筆（ライナーブラシ）"],"care":["ネイルオイル","除光液（修正用）"]}},{"id":"sakura","name":"さくらミルク ニュアンス","world":"和ニュアンス","colorFam":"スキンカラー","texture":"ジェリー","pattern":"柄なし","season":"春","difficulty":"入門","colors":["#f9dcd6","#f6c3cf","#fbeae4","#f3b7c4","#f9dcd6"],"desc":"桜の花びらみたいな淡ピンクを、ミルク色でにじませた和のニュアンス。肌なじみがよく、入学・入園シーズンにも。写真はミルキーベージュのニュアンスで着けた感じです。","art":"カラーを薄く2度塗りし、乾く前に別色を小さく置いて綿棒の先で軽くぼかすと、花びらみたいなにじみになります。","items":{"base":["ピールオフベース（剥がせるタイプ）","ベースコート"],"color":["カラージェル／ポリッシュ（淡ピンク系）","カラージェル／ポリッシュ（ミルクホワイト系）"],"parts":["金箔風フレーク（ほんの少し）"],"tools":["綿棒","つまようじ"],"care":["ネイルオイル","除光液（修正用）"]}},{"id":"syrup","name":"シロップピーチ グラデ","world":"韓シロップ","colorFam":"季節色","texture":"ジェリー","pattern":"ドット","season":"夏","difficulty":"初級","colors":["#ffd9c2","#ffc4a3","#ffb08a","#ff9d70","#ffcfae"],"desc":"韓国ネイルで人気のシロップ質感。透け感のあるピーチを爪先に向かって濃くするグラデーションに、小さなドットを添えて。写真はピンクのグラデーションで着けた感じです。","art":"スポンジに色をのせて爪先からポンポンと叩き、3回に分けて濃くします。最後にドット棒で白い小ドットを3つ置きます。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（透けピーチ系）","カラージェル／ポリッシュ（ホワイト系）"],"parts":[],"tools":["メイクスポンジ","ドット棒（なければつまようじ）"],"care":["ネイルオイル"]}},{"id":"french","name":"パリの朝 フレンチ","world":"欧ミニマル","colorFam":"スキンカラー","texture":"ジェリー","pattern":"柄なし","season":"通年","difficulty":"初級","colors":["#f7e3da","#f7e3da","#f7e3da","#f7e3da","#f7e3da"],"desc":"ヨーロッパ風ミニマルの定番。ヌードベージュに細い白フレンチで、指が長く見える清楚なデザイン。お仕事ネイルにも。","art":"フレンチガイドシールを貼って爪先だけ白く塗り、乾く前にシールをはがすと線がシャープに。細筆で直線を引く方法でもOK。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（ヌードベージュ系）","カラージェル／ポリッシュ（ホワイト系）"],"parts":["フレンチガイドシール"],"tools":["細筆（ライナーブラシ）"],"care":["除光液（修正用）","ネイルオイル"]}},{"id":"sunset","name":"LAサンセット クローム","world":"米ゴージャス","colorFam":"季節色","texture":"クローム","pattern":"ギャル系","season":"夏","difficulty":"中級","colors":["#ffb37a","#ff8f6b","#f76d8a","#e85d9e","#ffb37a"],"desc":"夕焼け色の上にクロームパウダーを重ねた、アメリカ西海岸みたいなゴージャス仕様。光で色が変わって見えます。","art":"カラーを塗って半乾きのタイミングでクロームパウダーをチップでこすりつけます。全面ではなく爪先側だけにすると夕焼けグラデに。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（オレンジ系）","カラージェル／ポリッシュ（ピンク系）"],"parts":["クロームパウダー（ミラーパウダー）","アイシャドウチップ"],"tools":["シリコンブラシ"],"care":["ネイルオイル"]}},{"id":"matcha","name":"抹茶ラテ チェック","world":"和ニュアンス","colorFam":"アース","texture":"ジェリー","pattern":"チェック","season":"秋","difficulty":"中級","colors":["#dfe5cf","#b9c49a","#e9e2cf","#a7b78b","#dfe5cf"],"desc":"抹茶とミルクの2色で作る、ほっこり和チェック。アースカラーで秋の装いにも合わせやすい落ち着きデザイン。","art":"ベース色を塗って乾かしてから、細筆で縦線2本・横線2本を引くだけ。線は一気に引かず、短く継ぎ足すとブレません。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（抹茶グリーン系）","カラージェル／ポリッシュ（ミルク系）","カラージェル／ポリッシュ（ブラウン系・線用）"],"parts":[],"tools":["細筆（ライナーブラシ）"],"care":["ネイルオイル"]}},{"id":"mintdot","name":"ミント ドットポップ","world":"韓シロップ","colorFam":"季節色","texture":"ジェリー","pattern":"ドット","season":"夏","difficulty":"入門","colors":["#cdf2e4","#b5ead6","#cdf2e4","#b5ead6","#cdf2e4"],"desc":"爽やかミントに白ドットを散らした、失敗しにくい入門デザイン。ドットはつまようじでも描けます。","art":"ドット棒（なければつまようじの丸い方）に白を付け、爪の根元側に大きめ、爪先側に小さめと大きさを変えて置くとリズムが出ます。","items":{"base":["ピールオフベース（剥がせるタイプ）"],"color":["カラージェル／ポリッシュ（ミント系）","カラージェル／ポリッシュ（ホワイト系）"],"parts":[],"tools":["ドット棒（なければつまようじ）"],"care":["ネイルオイル"]}},{"id":"magnet","name":"テラコッタ マグネット","world":"欧ミニマル","colorFam":"アース","texture":"マグネット","pattern":"柄なし","season":"秋","difficulty":"中級","colors":["#c96f4a","#bd6240","#c96f4a","#bd6240","#c96f4a"],"desc":"磁石で光の筋を寄せるマグネットネイルを、大人っぽいテラコッタで。動くたびに光が流れて高見えします。","art":"マグネットジェルを塗ったら乾かす前に磁石を爪の上にかざし、光の筋を中央に寄せます。磁石は近づけすぎず、5秒キープが目安。","items":{"base":["ベースコート"],"color":["マグネットジェル（テラコッタ系）"],"parts":["ネイル用マグネット（磁石スティック）"],"tools":[],"care":["ネイルオイル"]}},{"id":"leopard","name":"ピンクヒョウ ギャル","world":"米ゴージャス","colorFam":"スキンカラー","texture":"ジェリー","pattern":"ヒョウ柄","season":"通年","difficulty":"上級","colors":["#ffd3e2","#ffc2d6","#ffd3e2","#ffc2d6","#ffd3e2"],"desc":"ヒョウ柄の地色をピンクに変えたギャル系デザイン。斑点は「丸を描いて縁を黒で囲む」だけですが、筆のコントロールが要る上級編。","art":"まずピンクの上に濃いピンクで不揃いの丸を5〜6個。その縁を黒の細筆で「C」の字を描くように囲みます。全部囲まず、2〜3か所空けると本物っぽく。","items":{"base":["ベースコート"],"color":["カラージェル／ポリッシュ（ピンク系）","カラージェル／ポリッシュ（濃ピンク系）","カラージェル／ポリッシュ（ブラック系）"],"parts":[],"tools":["細筆（ライナーブラシ）","ドット棒"],"care":["除光液（修正用）","ネイルオイル"]}},{"id":"snow","name":"雪の結晶 ホワイト","world":"和ニュアンス","colorFam":"スキンカラー","texture":"クローム","pattern":"柄なし","season":"ク
